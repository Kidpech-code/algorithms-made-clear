<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="670" viewBox="0 0 1320 670" role="img" aria-labelledby="title desc">
<title id="title">Search algorithms: linear versus binary</title>
<desc id="desc">The target is 3. Linear search checks an unsorted tray left to right and finds index 5 after six checks. Binary search requires the sorted shelf, probes indices 3, 1, 2, and finds index 2 after three probes.</desc>
<rect x="0" y="0" width="1320" height="670" rx="0" fill="#F5F8FB" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="1320" height="168" rx="0" fill="#142B3E" stroke="none" stroke-width="1"/>
<rect x="56" y="49" width="8" height="70" rx="4" fill="#40C5C1" stroke="none" stroke-width="1"/>
<text x="84" y="78" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" text-anchor="start">02 / SEARCH ALGORITHMS</text>
<text x="84" y="128" fill="#D1E4EE" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start">The same target. Two ways to look for it. Order is the deciding factor.</text>
<rect x="54" y="196" width="584" height="412" rx="26" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<text x="90" y="252" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start">LINEAR SEARCH</text>
<text x="90" y="289" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">Unsorted tray · check each item</text>
<rect x="90" y="315" width="160" height="41" rx="20" fill="#DCF5E9" stroke="#42A576" stroke-width="2"/>
<text x="170" y="342" fill="#0B7054" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">TARGET: 3</text>
<rect x="96" y="379" width="66" height="66" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="129.0" y="425.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">5</text><text x="129.0" y="472" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 0</text>
<rect x="179" y="379" width="66" height="66" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="212.0" y="425.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">1</text><text x="212.0" y="472" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 1</text>
<rect x="262" y="379" width="66" height="66" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="295.0" y="425.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">4</text><text x="295.0" y="472" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 2</text>
<rect x="345" y="379" width="66" height="66" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="378.0" y="425.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">2</text><text x="378.0" y="472" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 3</text>
<rect x="428" y="379" width="66" height="66" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="461.0" y="425.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">8</text><text x="461.0" y="472" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 4</text>
<rect x="511" y="379" width="66" height="66" rx="14" fill="#DCF5E9" stroke="#42A576" stroke-width="2"/><text x="544.0" y="425.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">3</text><text x="544.0" y="472" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 5</text>
<rect x="90" y="501" width="512" height="57" rx="12" fill="#142B3E" stroke="none" stroke-width="1"/>
<text x="112" y="538" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">6 checks  •  found at index 5</text>
<text x="90" y="592" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Works without sorting first.</text>
<rect x="682" y="196" width="584" height="412" rx="26" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<text x="718" y="252" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start">BINARY SEARCH</text>
<text x="718" y="289" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">Sorted shelf · repeatedly halve</text>
<rect x="718" y="315" width="160" height="41" rx="20" fill="#DCF5E9" stroke="#42A576" stroke-width="2"/>
<text x="798" y="342" fill="#0B7054" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">TARGET: 3</text>
<rect x="724" y="379" width="66" height="66" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="757.0" y="425.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">1</text><text x="757.0" y="472" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 0</text>
<rect x="807" y="379" width="66" height="66" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="840.0" y="425.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">2</text><text x="840.0" y="472" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 1</text>
<rect x="890" y="379" width="66" height="66" rx="14" fill="#DCF5E9" stroke="#42A576" stroke-width="2"/><text x="923.0" y="425.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">3</text><text x="923.0" y="472" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 2</text>
<rect x="973" y="379" width="66" height="66" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="1006.0" y="425.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">4</text><text x="1006.0" y="472" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 3</text>
<rect x="1056" y="379" width="66" height="66" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="1089.0" y="425.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">5</text><text x="1089.0" y="472" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 4</text>
<rect x="1139" y="379" width="66" height="66" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="1172.0" y="425.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">8</text><text x="1172.0" y="472" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 5</text>
<rect x="718" y="501" width="512" height="57" rx="12" fill="#142B3E" stroke="none" stroke-width="1"/>
<text x="740" y="538" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">3 probes  •  found at index 2</text>
<text x="718" y="592" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Only valid because the shelf is sorted.</text>
<text x="660" y="645" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">An index is a position counted from 0.</text>
</svg>
