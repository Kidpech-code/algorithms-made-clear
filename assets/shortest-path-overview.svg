<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="790" viewBox="0 0 1320 790" role="img" aria-labelledby="title desc">
<title id="title">Fewest doors and fastest walk can be different routes</title>
<desc id="desc">In the same six-room museum, breadth-first search finds room 5 to room 4 to room 3: two doors but 6 plus 5 equals 11 minutes. Dijkstra finds room 5 to room 1 to room 8 to room 3: three doors but 2 plus 3 plus 2 equals 7 minutes. Corridors work both ways and walking times are nonnegative.</desc>
<rect width="1320" height="790" fill="#F5F8FB"/>
<rect width="1320" height="168" fill="#142B3E"/>
<rect x="56" y="49" width="8" height="70" rx="4" fill="#40C5C1"/>
<text x="84" y="78" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700">07 / SHORTEST PATHS</text>
<text x="84" y="128" fill="#D1E4EE" font-family="Arial, Helvetica, sans-serif" font-size="25">A shorter-looking route can take longer to walk.</text>

<rect x="54" y="194" width="1212" height="94" rx="22" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<text x="88" y="236" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Goal: walk from museum room 5 to room 3.</text>
<text x="88" y="270" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21">The number on each corridor is its walking time in minutes.</text>

<rect x="54" y="310" width="584" height="332" rx="25" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<rect x="88" y="342" width="7" height="51" rx="3" fill="#A95D10"/>
<text x="113" y="374" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">BFS / FEWEST DOORS</text>
<text x="88" y="420" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21">Counts corridors, without using their times.</text>
<circle cx="150" cy="500" r="32" fill="#FFF0C6" stroke="#C47A1B" stroke-width="3"/>
<text x="150" y="511" text-anchor="middle" fill="#75410B" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">5</text>
<text x="242" y="509" text-anchor="middle" fill="#75410B" font-family="Arial, Helvetica, sans-serif" font-size="25">6 min →</text>
<circle cx="330" cy="500" r="32" fill="#FFF0C6" stroke="#C47A1B" stroke-width="3"/>
<text x="330" y="511" text-anchor="middle" fill="#75410B" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">4</text>
<text x="422" y="509" text-anchor="middle" fill="#75410B" font-family="Arial, Helvetica, sans-serif" font-size="25">5 min →</text>
<circle cx="510" cy="500" r="32" fill="#FFF0C6" stroke="#C47A1B" stroke-width="3"/>
<text x="510" y="511" text-anchor="middle" fill="#75410B" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">3</text>
<rect x="88" y="557" width="516" height="55" rx="14" fill="#FFF0C6"/>
<text x="112" y="593" fill="#75410B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">2 doors · 6 + 5 = 11 minutes</text>

<rect x="682" y="310" width="584" height="332" rx="25" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<rect x="716" y="342" width="7" height="51" rx="3" fill="#0B766E"/>
<text x="741" y="374" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">DIJKSTRA / LEAST TIME</text>
<text x="716" y="420" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21">Adds walking times across each route.</text>
<circle cx="766" cy="500" r="30" fill="#EAF6F4" stroke="#0B766E" stroke-width="3"/>
<text x="766" y="511" text-anchor="middle" fill="#0B605B" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">5</text>
<text x="833" y="507" text-anchor="middle" fill="#0B605B" font-family="Arial, Helvetica, sans-serif" font-size="20">2 →</text>
<circle cx="899" cy="500" r="30" fill="#EAF6F4" stroke="#0B766E" stroke-width="3"/>
<text x="899" y="511" text-anchor="middle" fill="#0B605B" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">1</text>
<text x="965" y="507" text-anchor="middle" fill="#0B605B" font-family="Arial, Helvetica, sans-serif" font-size="20">3 →</text>
<circle cx="1032" cy="500" r="30" fill="#EAF6F4" stroke="#0B766E" stroke-width="3"/>
<text x="1032" y="511" text-anchor="middle" fill="#0B605B" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">8</text>
<text x="1098" y="507" text-anchor="middle" fill="#0B605B" font-family="Arial, Helvetica, sans-serif" font-size="20">2 →</text>
<circle cx="1165" cy="500" r="30" fill="#EAF6F4" stroke="#0B766E" stroke-width="3"/>
<text x="1165" y="511" text-anchor="middle" fill="#0B605B" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">3</text>
<rect x="716" y="557" width="516" height="55" rx="14" fill="#EAF6F4"/>
<text x="740" y="593" fill="#0B605B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">3 doors · 2 + 3 + 2 = 7 minutes</text>

<rect x="54" y="666" width="1212" height="80" rx="21" fill="#EAF6F4" stroke="#9CCDC5" stroke-width="2"/>
<text x="88" y="716" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Choose the measure that matters: doors for BFS, total walking time for Dijkstra.</text>
<text x="660" y="779" text-anchor="middle" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19">See the Dijkstra guide for the complete weighted room map.</text>
</svg>
