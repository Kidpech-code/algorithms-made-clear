<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1060" viewBox="0 0 1320 1060" role="img" aria-labelledby="title desc">
<title id="title">Bottom-up dynamic programming table for the minimum token problem</title>
<desc id="desc">With unlimited tokens worth 1, 3, and 4, the minimum token counts for amounts 0 through 6 are 0, 1, 2, 1, 1, 2, 2. For amount 6, choosing token 1 gives 1 plus F of 5 equals 3; choosing 3 gives 1 plus F of 3 equals 2; choosing 4 gives 1 plus F of 2 equals 3. The best choice is 3 plus 3, two tokens.</desc>
<rect width="1320" height="1060" fill="#F5F8FB"/>
<rect width="1320" height="168" fill="#142B3E"/>
<rect x="56" y="49" width="8" height="70" rx="4" fill="#40C5C1"/>
<text x="84" y="78" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700">06 / MINIMUM TOKENS</text>
<text x="84" y="128" fill="#D1E4EE" font-family="Arial, Helvetica, sans-serif" font-size="25">Fill the small answers first, then solve the target.</text>

<rect x="54" y="190" width="1212" height="77" rx="21" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<text x="88" y="239" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Values: 1, 3, 4  ·  Unlimited use  ·  Target: 6</text>
<rect x="54" y="284" width="1212" height="93" rx="21" fill="#EAF6F4" stroke="#9CCDC5" stroke-width="2"/>
<text x="88" y="320" fill="#0B605B" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">RULE</text>
<text x="88" y="354" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="25">F(0) = 0; for a &gt; 0, F(a) = min(1 + F(a - c)) over values c that fit.</text>

<rect x="54" y="397" width="1212" height="219" rx="24" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<text x="88" y="441" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">1 / BUILD THE TABLE FROM LEFT TO RIGHT</text>
<text x="88" y="471" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="20">Each cell can read the answers to smaller totals.</text>
<rect x="80" y="493" width="155" height="101" rx="16" fill="#F5F8FB" stroke="#D6E3ED" stroke-width="2"/>
<text x="157" y="529" text-anchor="middle" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21">a = 0</text>
<text x="157" y="567" text-anchor="middle" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">F = 0</text>
<rect x="247" y="493" width="155" height="101" rx="16" fill="#F5F8FB" stroke="#D6E3ED" stroke-width="2"/>
<text x="324" y="529" text-anchor="middle" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21">a = 1</text>
<text x="324" y="567" text-anchor="middle" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">F = 1</text>
<rect x="414" y="493" width="155" height="101" rx="16" fill="#F5F8FB" stroke="#D6E3ED" stroke-width="2"/>
<text x="491" y="529" text-anchor="middle" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21">a = 2</text>
<text x="491" y="567" text-anchor="middle" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">F = 2</text>
<rect x="581" y="493" width="155" height="101" rx="16" fill="#F5F8FB" stroke="#D6E3ED" stroke-width="2"/>
<text x="658" y="529" text-anchor="middle" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21">a = 3</text>
<text x="658" y="567" text-anchor="middle" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">F = 1</text>
<rect x="748" y="493" width="155" height="101" rx="16" fill="#F5F8FB" stroke="#D6E3ED" stroke-width="2"/>
<text x="825" y="529" text-anchor="middle" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21">a = 4</text>
<text x="825" y="567" text-anchor="middle" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">F = 1</text>
<rect x="915" y="493" width="155" height="101" rx="16" fill="#F5F8FB" stroke="#D6E3ED" stroke-width="2"/>
<text x="992" y="529" text-anchor="middle" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21">a = 5</text>
<text x="992" y="567" text-anchor="middle" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">F = 2</text>
<rect x="1082" y="493" width="155" height="101" rx="16" fill="#EAF6F4" stroke="#0B766E" stroke-width="3"/>
<text x="1159" y="529" text-anchor="middle" fill="#0B605B" font-family="Arial, Helvetica, sans-serif" font-size="21">a = 6</text>
<text x="1159" y="567" text-anchor="middle" fill="#0B605B" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">F = 2</text>

<rect x="54" y="636" width="1212" height="266" rx="24" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<text x="88" y="680" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">2 / FOR TOTAL 6, TRY EACH POSSIBLE FINAL TOKEN</text>
<text x="88" y="711" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="20">One token now + the saved best answer for the remaining total.</text>
<rect x="88" y="727" width="1144" height="46" rx="10" fill="#F5F8FB"/>
<text x="112" y="758" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="23">Choose 1</text>
<text x="432" y="758" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="23">1 + F(5) = 1 + 2</text>
<text x="1038" y="758" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">3 tokens</text>
<rect x="88" y="782" width="1144" height="46" rx="10" fill="#EAF6F4" stroke="#0B766E" stroke-width="2"/>
<text x="112" y="813" fill="#0B605B" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Choose 3</text>
<text x="432" y="813" fill="#0B605B" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">1 + F(3) = 1 + 1</text>
<text x="1038" y="813" fill="#0B605B" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">2 tokens</text>
<rect x="88" y="837" width="1144" height="46" rx="10" fill="#F5F8FB"/>
<text x="112" y="868" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="23">Choose 4</text>
<text x="432" y="868" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="23">1 + F(2) = 1 + 2</text>
<text x="1038" y="868" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">3 tokens</text>

<rect x="54" y="923" width="1212" height="94" rx="22" fill="#EAF6F4" stroke="#9CCDC5" stroke-width="2"/>
<text x="88" y="961" fill="#0B605B" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">BEST ANSWER</text>
<text x="88" y="997" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">F(6) = min(3, 2, 3) = 2 tokens: 3 + 3 = 6.</text>
<text x="660" y="1045" text-anchor="middle" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19">The table is computed once, so each smaller answer is ready when needed.</text>
</svg>
