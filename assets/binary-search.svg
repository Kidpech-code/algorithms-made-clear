<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="988" viewBox="0 0 1320 988" role="img" aria-labelledby="title desc">
<title id="title">Binary search with a sorted list and half-open bounds</title>
<desc id="desc">Sorted list 1, 2, 3, 4, 5, 8, target 3. Begin with half-open interval [0,6). Probe index 3 with value 4: set high to 3. Probe index 1 with value 2: set low to 2. Probe index 2 with value 3: set high to 2. Bounds meet at 2; verify A[2] is 3 and return index 2.</desc>
<rect x="0" y="0" width="1320" height="988" rx="0" fill="#F5F8FB" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="1320" height="168" rx="0" fill="#142B3E" stroke="none" stroke-width="1"/>
<rect x="56" y="49" width="8" height="70" rx="4" fill="#40C5C1" stroke="none" stroke-width="1"/>
<text x="84" y="78" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" text-anchor="start">02 / BINARY SEARCH</text>
<text x="84" y="128" fill="#D1E4EE" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start">The list must already be sorted. Keep only the half that can contain 3.</text>
<rect x="54" y="188" width="1212" height="162" rx="26" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<text x="90" y="244" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">REQUIRED INPUT</text>
<text x="90" y="282" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">A = [1, 2, 3, 4, 5, 8]</text>
<text x="90" y="322" fill="#0B7054" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Sorted in ascending order.</text>
<rect x="623" y="218" width="74" height="70" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2"/><text x="660.0" y="266.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">1</text><text x="660.0" y="315" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 0</text>
<rect x="719" y="218" width="74" height="70" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2"/><text x="756.0" y="266.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">2</text><text x="756.0" y="315" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 1</text>
<rect x="815" y="218" width="74" height="70" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2"/><text x="852.0" y="266.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">3</text><text x="852.0" y="315" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 2</text>
<rect x="911" y="218" width="74" height="70" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2"/><text x="948.0" y="266.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">4</text><text x="948.0" y="315" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 3</text>
<rect x="1007" y="218" width="74" height="70" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2"/><text x="1044.0" y="266.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">5</text><text x="1044.0" y="315" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 4</text>
<rect x="1103" y="218" width="74" height="70" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2"/><text x="1140.0" y="266.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">8</text><text x="1140.0" y="315" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 5</text>
<rect x="54" y="370" width="1212" height="150" rx="22" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<text x="90" y="413" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">PROBE 1  ·  range [0, 6)</text>
<text x="90" y="453" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">mid = 0 + (6 - 0) / 2 = 3</text>
<text x="90" y="493" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">A[3] = 4 ≥ 3  →  high = 3</text>
<rect x="653" y="393" width="70" height="66" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2"/><text x="688.0" y="439.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">1</text>
<rect x="746" y="393" width="70" height="66" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2"/><text x="781.0" y="439.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">2</text>
<rect x="839" y="393" width="70" height="66" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2"/><text x="874.0" y="439.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">3</text>
<rect x="932" y="393" width="70" height="66" rx="14" fill="#FFF0C6" stroke="#E0A03E" stroke-width="2"/><text x="967.0" y="439.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">4</text>
<rect x="1025" y="393" width="70" height="66" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2"/><text x="1060.0" y="439.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">5</text>
<rect x="1118" y="393" width="70" height="66" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2"/><text x="1153.0" y="439.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">8</text>
<text x="932" y="493" fill="#0B7054" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">NEXT [0, 3)</text>
<rect x="54" y="536" width="1212" height="150" rx="22" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<text x="90" y="579" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">PROBE 2  ·  range [0, 3)</text>
<text x="90" y="619" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">mid = 0 + (3 - 0) / 2 = 1</text>
<text x="90" y="659" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">A[1] = 2 &lt; 3  →  low = 2</text>
<rect x="653" y="559" width="70" height="66" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2"/><text x="688.0" y="605.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">1</text>
<rect x="746" y="559" width="70" height="66" rx="14" fill="#FFF0C6" stroke="#E0A03E" stroke-width="2"/><text x="781.0" y="605.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">2</text>
<rect x="839" y="559" width="70" height="66" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2"/><text x="874.0" y="605.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">3</text>
<rect x="932" y="559" width="70" height="66" rx="14" fill="#E9EFF4" stroke="#CCD9E3" stroke-width="2"/><text x="967.0" y="605.0" fill="#778B9B" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">4</text>
<rect x="1025" y="559" width="70" height="66" rx="14" fill="#E9EFF4" stroke="#CCD9E3" stroke-width="2"/><text x="1060.0" y="605.0" fill="#778B9B" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">5</text>
<rect x="1118" y="559" width="70" height="66" rx="14" fill="#E9EFF4" stroke="#CCD9E3" stroke-width="2"/><text x="1153.0" y="605.0" fill="#778B9B" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">8</text>
<text x="932" y="659" fill="#0B7054" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">NEXT [2, 3)</text>
<rect x="54" y="702" width="1212" height="150" rx="22" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<text x="90" y="745" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">PROBE 3  ·  range [2, 3)</text>
<text x="90" y="785" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">mid = 2 + (3 - 2) / 2 = 2</text>
<text x="90" y="825" fill="#0B7054" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">A[2] = 3 ≥ 3  →  high = 2</text>
<rect x="653" y="725" width="70" height="66" rx="14" fill="#E9EFF4" stroke="#CCD9E3" stroke-width="2"/><text x="688.0" y="771.0" fill="#778B9B" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">1</text>
<rect x="746" y="725" width="70" height="66" rx="14" fill="#E9EFF4" stroke="#CCD9E3" stroke-width="2"/><text x="781.0" y="771.0" fill="#778B9B" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">2</text>
<rect x="839" y="725" width="70" height="66" rx="14" fill="#FFF0C6" stroke="#E0A03E" stroke-width="2"/><text x="874.0" y="771.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">3</text>
<rect x="932" y="725" width="70" height="66" rx="14" fill="#E9EFF4" stroke="#CCD9E3" stroke-width="2"/><text x="967.0" y="771.0" fill="#778B9B" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">4</text>
<rect x="1025" y="725" width="70" height="66" rx="14" fill="#E9EFF4" stroke="#CCD9E3" stroke-width="2"/><text x="1060.0" y="771.0" fill="#778B9B" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">5</text>
<rect x="1118" y="725" width="70" height="66" rx="14" fill="#E9EFF4" stroke="#CCD9E3" stroke-width="2"/><text x="1153.0" y="771.0" fill="#778B9B" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">8</text>
<text x="932" y="825" fill="#0B7054" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">NEXT [2, 2)</text>
<rect x="54" y="880" width="1212" height="86" rx="20" fill="#DCF5E9" stroke="#42A576" stroke-width="2"/>
<text x="90" y="918" fill="#0B7054" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">FINAL CHECK</text>
<text x="90" y="949" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">low = high = 2; A[2] = 3. Return index 2 after three probes.</text>
</svg>
