<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="870" viewBox="0 0 1320 870" role="img" aria-labelledby="title desc">
<title id="title">Linear search, six checks to find 3</title>
<desc id="desc">In the unsorted list 5, 1, 4, 2, 8, 3, check indexes 0, 1, 2, 3, 4, and 5 in order. The first five do not match. Index 5 contains 3, so return 5 after six comparisons.</desc>
<rect x="0" y="0" width="1320" height="870" rx="0" fill="#F5F8FB" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="1320" height="168" rx="0" fill="#142B3E" stroke="none" stroke-width="1"/>
<rect x="56" y="49" width="8" height="70" rx="4" fill="#40C5C1" stroke="none" stroke-width="1"/>
<text x="84" y="78" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" text-anchor="start">01 / LINEAR SEARCH</text>
<text x="84" y="128" fill="#D1E4EE" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start">Search for 3 in an unsorted tray. Start at the left and stop at the first match.</text>
<rect x="54" y="188" width="1212" height="178" rx="26" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<text x="90" y="248" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">INPUT</text>
<text x="90" y="286" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">A = [5, 1, 4, 2, 8, 3]</text>
<text x="90" y="326" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">No sorting step is required.</text>
<rect x="600" y="218" width="76" height="72" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="638.0" y="267.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">5</text><text x="638.0" y="317" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 0</text>
<rect x="695" y="218" width="76" height="72" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="733.0" y="267.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">1</text><text x="733.0" y="317" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 1</text>
<rect x="790" y="218" width="76" height="72" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="828.0" y="267.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">4</text><text x="828.0" y="317" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 2</text>
<rect x="885" y="218" width="76" height="72" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="923.0" y="267.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">2</text><text x="923.0" y="317" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 3</text>
<rect x="980" y="218" width="76" height="72" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="1018.0" y="267.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">8</text><text x="1018.0" y="317" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 4</text>
<rect x="1075" y="218" width="76" height="72" rx="14" fill="#DCF5E9" stroke="#42A576" stroke-width="2"/><text x="1113.0" y="267.0" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">3</text><text x="1113.0" y="317" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle">i = 5</text>
<rect x="54" y="392" width="385" height="176" rx="20" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<text x="79" y="433" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">CHECK 1  ·  i = 0</text>
<text x="79" y="489" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="start">A[0] = 5</text>
<text x="79" y="535" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">5 ≠ 3  →  continue</text>
<rect x="459" y="392" width="385" height="176" rx="20" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<text x="484" y="433" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">CHECK 2  ·  i = 1</text>
<text x="484" y="489" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="start">A[1] = 1</text>
<text x="484" y="535" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">1 ≠ 3  →  continue</text>
<rect x="864" y="392" width="385" height="176" rx="20" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<text x="889" y="433" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">CHECK 3  ·  i = 2</text>
<text x="889" y="489" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="start">A[2] = 4</text>
<text x="889" y="535" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">4 ≠ 3  →  continue</text>
<rect x="54" y="588" width="385" height="176" rx="20" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<text x="79" y="629" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">CHECK 4  ·  i = 3</text>
<text x="79" y="685" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="start">A[3] = 2</text>
<text x="79" y="731" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">2 ≠ 3  →  continue</text>
<rect x="459" y="588" width="385" height="176" rx="20" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<text x="484" y="629" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">CHECK 5  ·  i = 4</text>
<text x="484" y="685" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="start">A[4] = 8</text>
<text x="484" y="731" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">8 ≠ 3  →  continue</text>
<rect x="864" y="588" width="385" height="176" rx="20" fill="#E8F7EF" stroke="#42A576" stroke-width="2"/>
<text x="889" y="629" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">CHECK 6  ·  i = 5</text>
<text x="889" y="685" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="start">A[5] = 3</text>
<text x="889" y="731" fill="#0B7054" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">3 = 3  →  return 5</text>
<rect x="54" y="796" width="1212" height="55" rx="12" fill="#142B3E" stroke="none" stroke-width="1"/>
<text x="90" y="832" fill="#40C5C1" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">RESULT</text>
<text x="209" y="832" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">Index 5 · six equality checks · input stays unchanged</text>
</svg>
