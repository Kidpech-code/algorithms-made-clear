<rect x="850" y="534" width="7" height="51" rx="3" fill="#A95D10" stroke="none" stroke-width="0"/>
<text x="875" y="567" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start">DFS / FOLLOW A BRANCH</text>
<text x="862" y="608" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Visit order</text>
