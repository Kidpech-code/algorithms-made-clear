<text x="1124" y="437" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">8</text>
<text x="1155" y="436" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">→</text>
