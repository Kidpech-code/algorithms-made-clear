<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="795" viewBox="0 0 1320 795" role="img" aria-labelledby="title desc">
<title id="title">Graph algorithms: breadth-first and depth-first search</title>
<desc id="desc">Six rooms form an undirected graph with corridors 5–1, 5–4, 1–2, 1–8, 4–3, and 8–3. Starting at 5, breadth-first search visits 5, 1, 4, 2, 8, 3; depth-first search visits 5, 1, 2, 8, 3, 4.</desc>
<rect x="0" y="0" width="1320" height="795" rx="0" fill="#F5F8FB" stroke="none" stroke-width="0"/>
<rect x="0" y="0" width="1320" height="168" rx="0" fill="#142B3E" stroke="none" stroke-width="0"/>
<rect x="56" y="49" width="8" height="70" rx="4" fill="#40C5C1" stroke="none" stroke-width="0"/>
<text x="84" y="78" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" text-anchor="start">05 / GRAPH ALGORITHMS</text>
<text x="84" y="128" fill="#D1E4EE" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start">One map, two ways to explore it.</text>
<rect x="54" y="195" width="1212" height="71" rx="18" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<text x="87" y="240" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Six numbered rooms, six two-way corridors. Start at room 5.</text>
<rect x="54" y="286" width="750" height="433" rx="24" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<text x="87" y="333" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start">THE ROOM MAP</text>
<text x="87" y="364" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">A line means you can walk in either direction.</text>
<line x1="430" y1="412" x2="260" y2="515" stroke="#9AAFC0" stroke-width="5" stroke-linecap="round"/>
<line x1="430" y1="412" x2="620" y2="515" stroke="#9AAFC0" stroke-width="5" stroke-linecap="round"/>
<line x1="260" y1="515" x2="160" y2="651" stroke="#9AAFC0" stroke-width="5" stroke-linecap="round"/>
