<text x="1186" y="437" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">3</text>
<text x="862" y="473" fill="#0B766E" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">Nearest rooms are handled first.</text>
