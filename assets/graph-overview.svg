<text x="1000" y="663" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">2</text>
<text x="1031" y="662" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">→</text>
<circle cx="1062" cy="655" r="22" fill="#A95D10"/>
<text x="1062" y="663" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">8</text>
<text x="1093" y="662" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">→</text>
