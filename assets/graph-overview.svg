<circle cx="260" cy="515" r="37" fill="#DBEFFA" stroke="#55A8CC" stroke-width="3"/><text x="260" y="527" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="middle">1</text>
<circle cx="620" cy="515" r="37" fill="#DBEFFA" stroke="#55A8CC" stroke-width="3"/><text x="620" y="527" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="middle">4</text>
<circle cx="160" cy="651" r="37" fill="#DBEFFA" stroke="#55A8CC" stroke-width="3"/><text x="160" y="663" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="middle">2</text>
