<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="910" viewBox="0 0 1320 910" role="img" aria-labelledby="title desc">
<title id="title">Merge Sort from split to sorted</title>
<desc id="desc">Starting 5, 1, 4, 2, 8, 3. Split into 5, 1, 4 and 2, 8, 3; split to one-item stacks. Merge each half to 1, 4, 5 and 2, 3, 8. Merge to 1, 2, 3, 4, 5, 8.</desc>
<rect x="0" y="0" width="1320" height="910" rx="0" fill="#F5F8FB" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="1320" height="168" rx="0" fill="#142B3E" stroke="none" stroke-width="1"/>
<rect x="56" y="49" width="8" height="70" rx="4" fill="#40C5C1" stroke="none" stroke-width="1"/>
<text x="84" y="78" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" text-anchor="start">02 / MERGE SORT</text>
<text x="84" y="128" fill="#D1E4EE" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start">Receipt totals: split the stack, then merge sorted stacks by taking the smaller front.</text>
<rect x="54" y="188" width="1212" height="562" rx="26" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
