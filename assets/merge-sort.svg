<text x="90" y="498" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Six separate one-receipt stacks</text>
<rect x="620" y="431" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="656.0" y="478.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">5</text><rect x="706" y="431" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="742.0" y="478.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">1</text><rect x="792" y="431" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="828.0" y="478.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">4</text><rect x="878" y="431" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="914.0" y="478.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">2</text><rect x="964" y="431" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="1000.0" y="478.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">8</text><rect x="1050" y="431" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="1086.0" y="478.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">3</text>
<line x1="90" y1="516" x2="1228" y2="516" stroke="#E4ECF3" stroke-width="2"/>
<text x="90" y="577" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">MERGE EACH HALF</text>
<text x="90" y="608" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">[1, 4, 5] and [2, 3, 8]</text>
