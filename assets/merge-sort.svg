<text x="88" y="824" fill="#0B7054" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">COMPARISONS</text>
<text x="315" y="824" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">1 vs 2 → 1; 4 vs 2 → 2; 4 vs 3 → 3; then 4, 5, 8.</text>
