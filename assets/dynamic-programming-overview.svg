<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="800" viewBox="0 0 1320 800" role="img" aria-labelledby="title desc">
<title id="title">Dynamic programming finds the fewest tokens for a total of six</title>
<desc id="desc">With unlimited tokens worth 1, 3, and 4, repeatedly choosing the largest token gives 4 plus 1 plus 1, three tokens. Dynamic programming reuses the best answers for smaller totals and finds 3 plus 3, only two tokens.</desc>
<rect width="1320" height="800" fill="#F5F8FB"/>
<rect width="1320" height="168" fill="#142B3E"/>
<rect x="56" y="49" width="8" height="70" rx="4" fill="#40C5C1"/>
<text x="84" y="78" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700">06 / DYNAMIC PROGRAMMING</text>
<text x="84" y="128" fill="#D1E4EE" font-family="Arial, Helvetica, sans-serif" font-size="25">Keep the best smaller answers; use them to build the next one.</text>

<rect x="54" y="191" width="1212" height="95" rx="22" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<text x="88" y="232" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Goal: make a total of 6 with the fewest tokens.</text>
<text x="88" y="264" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21">Available values: 1, 3, and 4. You may reuse each value.</text>

<rect x="54" y="310" width="584" height="330" rx="25" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<rect x="88" y="340" width="7" height="51" rx="3" fill="#A95D10"/>
<text x="113" y="373" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">LARGEST FIRST</text>
<text x="88" y="420" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21">Take the biggest value that fits each time.</text>
<circle cx="160" cy="489" r="35" fill="#FFF0C6" stroke="#C47A1B" stroke-width="3"/>
<text x="160" y="501" text-anchor="middle" fill="#75410B" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">4</text>
<text x="218" y="500" text-anchor="middle" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="31">+</text>
<circle cx="276" cy="489" r="35" fill="#FFF0C6" stroke="#C47A1B" stroke-width="3"/>
<text x="276" y="501" text-anchor="middle" fill="#75410B" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">1</text>
<text x="334" y="500" text-anchor="middle" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="31">+</text>
<circle cx="392" cy="489" r="35" fill="#FFF0C6" stroke="#C47A1B" stroke-width="3"/>
<text x="392" y="501" text-anchor="middle" fill="#75410B" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">1</text>
<text x="452" y="500" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">= 6</text>
<rect x="89" y="547" width="160" height="54" rx="14" fill="#FFF0C6"/>
<text x="169" y="583" text-anchor="middle" fill="#75410B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">3 tokens</text>
<text x="268" y="580" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="20">A local choice misses the best answer.</text>

<rect x="682" y="310" width="584" height="330" rx="25" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<rect x="716" y="340" width="7" height="51" rx="3" fill="#0B766E"/>
<text x="741" y="373" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">DYNAMIC PROGRAMMING</text>
<text x="716" y="420" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21">Compare all final tokens using saved answers.</text>
<circle cx="788" cy="489" r="35" fill="#EAF6F4" stroke="#0B766E" stroke-width="3"/>
<text x="788" y="501" text-anchor="middle" fill="#0B605B" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">3</text>
<text x="846" y="500" text-anchor="middle" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="31">+</text>
<circle cx="904" cy="489" r="35" fill="#EAF6F4" stroke="#0B766E" stroke-width="3"/>
<text x="904" y="501" text-anchor="middle" fill="#0B605B" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">3</text>
<text x="965" y="500" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">= 6</text>
<rect x="717" y="547" width="160" height="54" rx="14" fill="#EAF6F4"/>
<text x="797" y="583" text-anchor="middle" fill="#0B605B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">2 tokens</text>
<text x="896" y="580" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="20">Best answer for this example.</text>

<rect x="54" y="664" width="1212" height="93" rx="22" fill="#EAF6F4" stroke="#9CCDC5" stroke-width="2"/>
<text x="88" y="703" fill="#0B605B" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">THE REUSABLE IDEA</text>
<text x="88" y="735" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="24">F(6) = min(1 + F(5), 1 + F(3), 1 + F(2)) = min(3, 2, 3) = 2.</text>
<text x="660" y="789" text-anchor="middle" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="19">F(a) is the fewest tokens needed to make total a; start with F(0) = 0.</text>
</svg>
