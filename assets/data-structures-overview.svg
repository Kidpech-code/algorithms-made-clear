<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="720" viewBox="0 0 1320 720" role="img" aria-labelledby="title desc">
<title id="title">Data structures: arrays and linked lists</title>
<desc id="desc">A fixed six-slot Go array stores 5, 1, 4, 2, 8, 3 by index. A singly linked list holds the same values as nodes connected from head to nil.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#2F7F8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1320" height="720" fill="#F5F8FB"/>
<rect width="1320" height="168" fill="#142B3E"/>
<rect x="56" y="49" width="8" height="70" rx="4" fill="#40C5C1"/>
<text x="84" y="78" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" text-anchor="start">03 / DATA STRUCTURES</text>
<text x="84" y="128" fill="#D1E4EE" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start">The same values. Two ways to organize and reach them.</text>
<rect x="54" y="196" width="584" height="446" rx="26" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2" />
<text x="90" y="252" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start">ARRAY</text>
<text x="90" y="290" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Numbered slots in a fixed-length Go array</text>
<text x="90" y="349" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">A := [6]int{5, 1, 4, 2, 8, 3}</text>
<rect x="90" y="382" width="64" height="67" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2" />
<text x="122.0" y="428.5" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="middle">5</text>
<text x="122" y="479" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">i=0</text>
<rect x="171" y="382" width="64" height="67" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2" />
<text x="203.0" y="428.5" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="middle">1</text>
<text x="203" y="479" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">i=1</text>
<rect x="252" y="382" width="64" height="67" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2" />
<text x="284.0" y="428.5" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="middle">4</text>
<text x="284" y="479" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">i=2</text>
<rect x="333" y="382" width="64" height="67" rx="14" fill="#FFF0C6" stroke="#E0A03E" stroke-width="2" />
<text x="365.0" y="428.5" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="middle">2</text>
<text x="365" y="479" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">i=3</text>
<rect x="414" y="382" width="64" height="67" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2" />
<text x="446.0" y="428.5" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="middle">8</text>
<text x="446" y="479" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">i=4</text>
<rect x="495" y="382" width="64" height="67" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2" />
<text x="527.0" y="428.5" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="middle">3</text>
<text x="527" y="479" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle">i=5</text>
<rect x="90" y="514" width="512" height="72" rx="12" fill="#142B3E" stroke="#142B3E" stroke-width="0" />
<text x="112" y="558" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">A[3] = 2  ·  go straight to slot 3</text>
<text x="90" y="617" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Positions are counted from 0.</text>
<rect x="682" y="196" width="584" height="446" rx="26" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2" />
<text x="718" y="252" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start">LINKED LIST</text>
<text x="718" y="290" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Nodes follow links from the head</text>
<text x="722" y="358" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">head</text>
<line x1="770" y1="371" x2="770" y2="387" stroke="#2F7F8A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="741" y="395" width="56" height="61" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2" />
<text x="769.0" y="438.5" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle">5</text>
<text x="769" y="483" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">i=0</text>
<line x1="798" y1="425" x2="819" y2="425" stroke="#2F7F8A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="821" y="395" width="56" height="61" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2" />
<text x="849.0" y="438.5" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle">1</text>
<text x="849" y="483" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">i=1</text>
<line x1="878" y1="425" x2="899" y2="425" stroke="#2F7F8A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="901" y="395" width="56" height="61" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2" />
<text x="929.0" y="438.5" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle">4</text>
<text x="929" y="483" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">i=2</text>
<line x1="958" y1="425" x2="979" y2="425" stroke="#2F7F8A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="981" y="395" width="56" height="61" rx="14" fill="#DCF5E9" stroke="#42A576" stroke-width="2" />
<text x="1009.0" y="438.5" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle">2</text>
<text x="1009" y="483" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">i=3</text>
<line x1="1038" y1="425" x2="1059" y2="425" stroke="#2F7F8A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1061" y="395" width="56" height="61" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2" />
<text x="1089.0" y="438.5" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle">8</text>
<text x="1089" y="483" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">i=4</text>
<line x1="1118" y1="425" x2="1139" y2="425" stroke="#2F7F8A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1141" y="395" width="56" height="61" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2" />
<text x="1169.0" y="438.5" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle">3</text>
<text x="1169" y="483" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle">i=5</text>
<line x1="1198" y1="425" x2="1220" y2="425" stroke="#2F7F8A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="1226" y="433" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">nil</text>
<rect x="718" y="514" width="512" height="72" rx="12" fill="#142B3E" stroke="#142B3E" stroke-width="0" />
<text x="740" y="558" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Visit 5 → 1 → 4 → 2 to reach index 3</text>
<text x="718" y="617" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Links show order, not memory location.</text>
<text x="660" y="687" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">Same sequence; different access and update costs.</text>
</svg>
