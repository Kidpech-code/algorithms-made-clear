<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="970" viewBox="0 0 1320 970" role="img" aria-labelledby="title desc">
<title id="title">Quick Sort using the last element as pivot</title>
<desc id="desc">Starting 5, 1, 4, 2, 8, 3 with pivot 3. Swap 5 with 1, then 5 with 2, then 4 with pivot 3. First partition is 1, 2, pivot 3, 5, 8, 4. The right side is not yet sorted. After recursive partitions, result is 1, 2, 3, 4, 5, 8.</desc>
<rect x="0" y="0" width="1320" height="970" rx="0" fill="#F5F8FB" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="1320" height="168" rx="0" fill="#142B3E" stroke="none" stroke-width="1"/>
<rect x="56" y="49" width="8" height="70" rx="4" fill="#40C5C1" stroke="none" stroke-width="1"/>
<text x="84" y="78" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" text-anchor="start">03 / QUICK SORT</text>
<text x="84" y="128" fill="#D1E4EE" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start">Numbered pickup tickets: choose the last ticket as pivot, then partition around it.</text>
<rect x="54" y="188" width="1212" height="640" rx="26" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<text x="90" y="249" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">START</text>
<text x="90" y="280" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">3 is the pivot (last ticket)</text>
<rect x="620" y="213" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="656.0" y="260.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">5</text><rect x="706" y="213" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="742.0" y="260.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">1</text><rect x="792" y="213" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="828.0" y="260.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">4</text><rect x="878" y="213" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="914.0" y="260.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">2</text><rect x="964" y="213" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="1000.0" y="260.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">8</text><rect x="1050" y="213" width="72" height="70" rx="14" fill="#FFE0DA" stroke="#E47C6C" stroke-width="2"/><text x="1086.0" y="260.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">3</text>
<line x1="90" y1="298" x2="1228" y2="298" stroke="#E4ECF3" stroke-width="2"/>
<text x="90" y="354" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">MOVE 1 LEFT</text>
<text x="90" y="385" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Swap 5 and 1</text>
<rect x="620" y="318" width="72" height="70" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2"/><text x="656.0" y="365.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">1</text><rect x="706" y="318" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="742.0" y="365.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">5</text><rect x="792" y="318" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="828.0" y="365.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">4</text><rect x="878" y="318" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="914.0" y="365.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">2</text><rect x="964" y="318" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="1000.0" y="365.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">8</text><rect x="1050" y="318" width="72" height="70" rx="14" fill="#FFE0DA" stroke="#E47C6C" stroke-width="2"/><text x="1086.0" y="365.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">3</text>
<line x1="90" y1="403" x2="1228" y2="403" stroke="#E4ECF3" stroke-width="2"/>
<text x="90" y="459" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">MOVE 2 LEFT</text>
<text x="90" y="490" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Swap 5 and 2</text>
<rect x="620" y="423" width="72" height="70" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2"/><text x="656.0" y="470.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">1</text><rect x="706" y="423" width="72" height="70" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2"/><text x="742.0" y="470.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">2</text><rect x="792" y="423" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="828.0" y="470.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">4</text><rect x="878" y="423" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="914.0" y="470.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">5</text><rect x="964" y="423" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="1000.0" y="470.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">8</text><rect x="1050" y="423" width="72" height="70" rx="14" fill="#FFE0DA" stroke="#E47C6C" stroke-width="2"/><text x="1086.0" y="470.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">3</text>
<line x1="90" y1="508" x2="1228" y2="508" stroke="#E4ECF3" stroke-width="2"/>
<text x="90" y="564" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">PLACE THE PIVOT</text>
<text x="90" y="595" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Swap 4 and 3</text>
<rect x="620" y="528" width="72" height="70" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2"/><text x="656.0" y="575.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">1</text><rect x="706" y="528" width="72" height="70" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2"/><text x="742.0" y="575.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">2</text><rect x="792" y="528" width="72" height="70" rx="14" fill="#FFE0DA" stroke="#E47C6C" stroke-width="2"/><text x="828.0" y="575.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">3</text><rect x="878" y="528" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="914.0" y="575.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">5</text><rect x="964" y="528" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="1000.0" y="575.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">8</text><rect x="1050" y="528" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="1086.0" y="575.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">4</text>
<line x1="90" y1="613" x2="1228" y2="613" stroke="#E4ECF3" stroke-width="2"/>
<line x1="784" y1="527" x2="784" y2="607" stroke="#526579" stroke-width="3"/>
<line x1="870" y1="527" x2="870" y2="607" stroke="#526579" stroke-width="3"/>
<text x="90" y="669" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">SORT EACH SIDE</text>
<text x="90" y="700" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Right side [5, 8, 4] still needs work</text>
<rect x="620" y="633" width="72" height="70" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2"/><text x="656.0" y="680.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">1</text><rect x="706" y="633" width="72" height="70" rx="14" fill="#DBEFFA" stroke="#55A8CC" stroke-width="2"/><text x="742.0" y="680.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">2</text><rect x="792" y="633" width="72" height="70" rx="14" fill="#FFE0DA" stroke="#E47C6C" stroke-width="2"/><text x="828.0" y="680.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">3</text><rect x="878" y="633" width="72" height="70" rx="14" fill="#FFF0C6" stroke="#E0A03E" stroke-width="2"/><text x="914.0" y="680.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">5</text><rect x="964" y="633" width="72" height="70" rx="14" fill="#FFF0C6" stroke="#E0A03E" stroke-width="2"/><text x="1000.0" y="680.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">8</text><rect x="1050" y="633" width="72" height="70" rx="14" fill="#FFF0C6" stroke="#E0A03E" stroke-width="2"/><text x="1086.0" y="680.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">4</text>
<line x1="90" y1="718" x2="1228" y2="718" stroke="#E4ECF3" stroke-width="2"/>
<text x="90" y="774" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">FINAL ORDER</text>
<text x="90" y="805" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">After recursive partitions</text>
<rect x="620" y="738" width="72" height="70" rx="14" fill="#DCF5E9" stroke="#42A576" stroke-width="2"/><text x="656.0" y="785.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">1</text><rect x="706" y="738" width="72" height="70" rx="14" fill="#DCF5E9" stroke="#42A576" stroke-width="2"/><text x="742.0" y="785.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">2</text><rect x="792" y="738" width="72" height="70" rx="14" fill="#DCF5E9" stroke="#42A576" stroke-width="2"/><text x="828.0" y="785.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">3</text><rect x="878" y="738" width="72" height="70" rx="14" fill="#DCF5E9" stroke="#42A576" stroke-width="2"/><text x="914.0" y="785.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">4</text><rect x="964" y="738" width="72" height="70" rx="14" fill="#DCF5E9" stroke="#42A576" stroke-width="2"/><text x="1000.0" y="785.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">5</text><rect x="1050" y="738" width="72" height="70" rx="14" fill="#DCF5E9" stroke="#42A576" stroke-width="2"/><text x="1086.0" y="785.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">8</text>
<text x="90" y="893" fill="#A13E30" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">PIVOT FACT</text>
<text x="285" y="893" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">After partition, the pivot is fixed; each side may still need sorting.</text>
</svg>
