<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="910" viewBox="0 0 1320 910" role="img" aria-labelledby="title desc">
<title id="title">Bubble Sort, first pass</title>
<desc id="desc">Starting 5, 1, 4, 2, 8, 3. Adjacent swaps are 5 with 1, 5 with 4, 5 with 2, and 8 with 3. End of pass one: 1, 4, 2, 5, 3, 8. The 8 is now fixed.</desc>
<rect x="0" y="0" width="1320" height="910" rx="0" fill="#F5F8FB" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="1320" height="168" rx="0" fill="#142B3E" stroke="none" stroke-width="1"/>
<rect x="56" y="49" width="8" height="70" rx="4" fill="#40C5C1" stroke="none" stroke-width="1"/>
<text x="84" y="78" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" text-anchor="start">01 / BUBBLE SORT</text>
<text x="84" y="128" fill="#D1E4EE" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start">Books by height: compare neighboring books; swap only if they are out of order.</text>
<rect x="54" y="188" width="1212" height="562" rx="26" fill="#FFFFFF" stroke="#D6E3ED" stroke-width="2"/>
<text x="90" y="249" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">START</text>
<text x="90" y="280" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Six books, left to right</text>
<rect x="620" y="213" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="656.0" y="260.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">5</text><rect x="706" y="213" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="742.0" y="260.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">1</text><rect x="792" y="213" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="828.0" y="260.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">4</text><rect x="878" y="213" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="914.0" y="260.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">2</text><rect x="964" y="213" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="1000.0" y="260.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">8</text><rect x="1050" y="213" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="1086.0" y="260.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">3</text>
<line x1="90" y1="298" x2="1228" y2="298" stroke="#E4ECF3" stroke-width="2"/>
<text x="90" y="347" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">SWAP 5 AND 1</text>
<text x="90" y="378" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">The left neighbor is larger</text>
<rect x="620" y="311" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="656.0" y="358.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">1</text><rect x="706" y="311" width="72" height="70" rx="14" fill="#FFF0C6" stroke="#E0A03E" stroke-width="2"/><text x="742.0" y="358.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">5</text><rect x="792" y="311" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="828.0" y="358.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">4</text><rect x="878" y="311" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="914.0" y="358.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">2</text><rect x="964" y="311" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="1000.0" y="358.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">8</text><rect x="1050" y="311" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="1086.0" y="358.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">3</text>
<line x1="90" y1="396" x2="1228" y2="396" stroke="#E4ECF3" stroke-width="2"/>
<text x="90" y="445" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">SWAP 5 AND 4</text>
<text x="90" y="476" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Keep moving along the line</text>
<rect x="620" y="409" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="656.0" y="456.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">1</text><rect x="706" y="409" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="742.0" y="456.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">4</text><rect x="792" y="409" width="72" height="70" rx="14" fill="#FFF0C6" stroke="#E0A03E" stroke-width="2"/><text x="828.0" y="456.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">5</text><rect x="878" y="409" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="914.0" y="456.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">2</text><rect x="964" y="409" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="1000.0" y="456.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">8</text><rect x="1050" y="409" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="1086.0" y="456.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">3</text>
<line x1="90" y1="494" x2="1228" y2="494" stroke="#E4ECF3" stroke-width="2"/>
<text x="90" y="543" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">SWAP 5 AND 2</text>
<text x="90" y="574" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Compare the next neighbors</text>
<rect x="620" y="507" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="656.0" y="554.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">1</text><rect x="706" y="507" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="742.0" y="554.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">4</text><rect x="792" y="507" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="828.0" y="554.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">2</text><rect x="878" y="507" width="72" height="70" rx="14" fill="#FFF0C6" stroke="#E0A03E" stroke-width="2"/><text x="914.0" y="554.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">5</text><rect x="964" y="507" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="1000.0" y="554.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">8</text><rect x="1050" y="507" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="1086.0" y="554.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">3</text>
<line x1="90" y1="592" x2="1228" y2="592" stroke="#E4ECF3" stroke-width="2"/>
<text x="90" y="641" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">SWAP 8 AND 3</text>
<text x="90" y="672" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">After 5 &lt; 8, leave them; then swap</text>
<rect x="620" y="605" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="656.0" y="652.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">1</text><rect x="706" y="605" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="742.0" y="652.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">4</text><rect x="792" y="605" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="828.0" y="652.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">2</text><rect x="878" y="605" width="72" height="70" rx="14" fill="#FFFFFF" stroke="#B8CBD9" stroke-width="2"/><text x="914.0" y="652.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">5</text><rect x="964" y="605" width="72" height="70" rx="14" fill="#FFF0C6" stroke="#E0A03E" stroke-width="2"/><text x="1000.0" y="652.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">3</text><rect x="1050" y="605" width="72" height="70" rx="14" fill="#DCF5E9" stroke="#42A576" stroke-width="2"/><text x="1086.0" y="652.92" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">8</text>
<text x="87" y="824" fill="#0B7054" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">AFTER PASS 1</text>
<text x="300" y="824" fill="#17293D" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">8 is in its final place. Repeat passes until no swaps occur.</text>
</svg>
